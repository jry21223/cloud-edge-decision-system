name: dream-ce-edge-cloud-v0.3
algorithm: DREAM-CE
local_confidence_threshold: 0.80
freshness_half_life_s: 5.0
minimum_consensus: 0.60
cloud_timeout_ms: 800
cloud_inference_delay_ms: 350
scenarios:
  - industrial
  - traffic
routes:
  - EDGE
  - CLOUD
  - EDGE_FALLBACK
  - EDGE_SAFETY
network_stress:
  rtt_ms: [20, 100, 300, 500]
  packet_loss: [0.0, 0.01, 0.05, 0.10]
  outage_s: [0, 5, 10, 30]
notes: >-
  该配置用于默认 Edge-Controller-Cloud MVP 联调。真实工业视觉准确率必须由
  有许可的金属工件数据、冻结模型与 Ground Truth 产生，不能由规则样例替代。
